[project]
name = "iclouddl"
dynamic = ["version"]
description = "Download photos and videos from an iCloud shared album, for those without an Apple device"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Amol Venkataraman" }]
requires-python = ">=3.9"
dependencies = ["requests>=2.28"]
keywords = ["icloud", "shared-album", "photos", "download", "cli", "exif"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Utilities",
]

[project.optional-dependencies]
# only needed to transcode genuine HEIC files to JPEG (iCloud usually serves JPEG already)
heic = ["pillow>=10.0", "pillow-heif>=0.13"]

[project.scripts]
iclouddl = "iclouddl:main"

[project.urls]
Homepage = "https://github.com/upstream-wontfix/ICloudDL"
Repository = "https://github.com/upstream-wontfix/ICloudDL"
Issues = "https://github.com/upstream-wontfix/ICloudDL/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "iclouddl.py"

# explicit allow-lists: the working tree holds exported cookies and downloaded photos
[tool.hatch.build.targets.sdist]
only-include = ["iclouddl.py", "README.md", "LICENSE", "DISCLAIMER.md", "requirements.txt", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
only-include = ["iclouddl.py"]
